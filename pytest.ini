[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    perf: performance test with a device session and background telemetry
    startup: startup benchmark (cold / warm / hot launches)
    journey: user journey performance test
    endurance(iterations): endurance / stress test repeated for N iterations
    benchmark: build-to-build comparison benchmark
log_cli = false
log_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s - %(message)s
filterwarnings =
    ignore::DeprecationWarning:appium.*
